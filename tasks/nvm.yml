---
- name: Ensure default Node via nvm and expose it on PATH.
  shell: |
    set -e
    . "$(brew --prefix nvm)/nvm.sh"
    if ! nvm ls {{ nvm_node_version }} --no-colors 2>/dev/null | grep -qE 'v[0-9]+\.[0-9]+\.[0-9]+'; then
      nvm install {{ nvm_node_version }}
    fi
    nvm alias default {{ nvm_node_version }}
    nvm use default >/dev/null
    BIN_DIR="$(dirname "$(command -v node)")"
    LINK_DIR="$(brew --prefix)/bin"
    for tool in node npm npx corepack; do
      if [ -e "$BIN_DIR/$tool" ]; then
        ln -sf "$BIN_DIR/$tool" "$LINK_DIR/$tool"
      fi
    done
  args:
    executable: /bin/bash
  changed_when: false
